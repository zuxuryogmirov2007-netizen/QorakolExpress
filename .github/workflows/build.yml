name: Build Qorakol Express APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o QorakolExpress_source-*.zip -d project
          cd project
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        working-directory: project
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QorakolExpress-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
